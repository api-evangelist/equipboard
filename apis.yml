aid: equipboard
name: Equipboard
description: >-
  Equipboard is a community-sourced music-gear discovery platform where musicians, producers,
  and DJs find the equipment behind the music. Members browse the gear their favorite artists
  play — guitars, effects pedals, synthesizers, DAWs, plug-ins, microphones, drum machines, and
  keyboards — build and share their own rigs and gear lists, read and write reviews, and follow
  buy-links to retailers. Equipboard is built by musicians for musicians and monetizes primarily
  through affiliate relationships (including the Amazon Associates Program). Recent product work
  adds album- and track-level gear attribution. The company is backed by 500 Global. Equipboard
  does not currently publish a public developer API; this profile is maintained by the API
  Evangelist network and enriched from Equipboard's public web surface.
